# .doc-writer/config.yaml — generated by /doc-writer:setup
version: 1

plugin_version: "1.7.1"

user_personas:
  - name: "Frontend developer"
    skill_level: "advanced"
    assumed_knowledge:
      - "TypeScript and React 18+ (hooks, props, rendering)"
      - "npm or pnpm, and bundlers such as Vite or Next.js"
      - "CopilotKit or assistant-ui: providers, chats and tool-call renderers"
      - "fetch, cookies and same-origin requests"
    never_assume:
      - "What Flint is, and that it needs vega, vega-lite and vega-tooltip to draw"
      - "What the show_chart tool is and the shape of its result"
      - "That a chart's rows live on the server behind data.url and expire"
      - "What the grain guard and implicit-aggregate mean"
      - "What the server must mount for the rows URL to answer"
    domain_context: >-
      Builds the chat UI of an analytics agent whose Python backend uses
      s-layer-flint-charts. Wants each show_chart call in the conversation to appear
      as a chart, with sensible loading and error states, in whichever chat framework
      the app uses.
    discovery_story: >-
      The backend team added chart_toolset to the agent, and the chat now shows raw
      show_chart tool calls; the frontend developer looked for the package that draws them.
    user_tasks:
      - "Install the package and its peers"
      - "Draw show_chart calls in CopilotKit"
      - "Draw show_chart calls in assistant-ui"
      - "Draw a chart from a tool result in plain React"
      - "Send credentials or headers with the rows request"
      - "Style or replace the loading box and the error note"
      - "Understand what a reader sees when a chart can't be drawn"
  - name: "Python backend developer"
    skill_level: "advanced"
    assumed_knowledge:
      - "Python 3.11+, async/await and type hints"
      - "Pydantic AI agents, tools and toolsets"
      - "ASGI apps (Starlette or FastAPI)"
      - "semolina SemanticView models and a semantic layer in the warehouse"
    never_assume:
      - "What Flint is and what a Flint input holds"
      - "Why the rows stay on the server and how the browser fetches them"
      - "What the grain guard refuses and why"
      - "What the flint-chart-mcp sidecar is and that it needs Node"
      - "How S-LAYER semantic formats map to Flint semantic types"
    domain_context: >-
      Builds the backend of an analytics agent over semantic views and wants the model
      to answer with charts whose numbers are exactly the query's, without sending rows
      through the model.
    discovery_story: >-
      Already queries semantic views with semolina and looked for a way to let an agent
      chart the results safely.
    user_tasks:
      - "Give a Pydantic AI agent query and chart tools"
      - "Mount the rows route and tie it to conversations"
      - "Validate charts with the Flint sidecar"
      - "Understand what the grain guard refuses"
      - "Map semantic formats to Flint types"

tone: "warm-businesslike"

use_cases: []

use_cases_section: false

doc_system: "sphinx-shibuya"
api_reference: "Python: docs/autoapi (sphinx-autoapi). TypeScript: hand-written docs/typescript.md"

paths:
  docs_root: "docs/"
  source_root: "src/s_layer_flint_charts/ and ts/src/"

detected:
  language: "python, typescript"
  doc_system: "sphinx-shibuya"
  existing_docs: true

qa_answers:
  navigation: "Sidebar"
  api_docs: "sphinx-autoapi for Python; hand-written reference for the TypeScript package"
