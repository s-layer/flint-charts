name: Release npm package

# Publishes @s-layer/flint-charts from ts/. Tag ts-vX.Y.Z after setting that version in
# ts/package.json; the Python package has its own vX.Y.Z tags.
on:
  push:
    tags:
      - "ts-v[0-9]+.[0-9]+.[0-9]+"
      - "ts-v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

jobs:
  quality:
    uses: ./.github/workflows/ts-quality.yml

  publish:
    name: Publish to npm
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/@s-layer/flint-charts
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ts
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: ts/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # npm 11.5+ publishes with trusted publishing (OIDC).
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the tag matches the package version
        if: github.event_name == 'push'
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "ts-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Build
        run: pnpm build

      - name: Publish
        # Pre-release versions (1.2.0-rc.1) go to the "next" dist-tag.
        run: |
          version=$(node -p "require('./package.json').version")
          tag=latest
          case "$version" in *-*) tag=next ;; esac
          npm publish --provenance --access public --tag "$tag"
