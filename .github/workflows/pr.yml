
name: PR Coverage Report

on:
  pull_request:
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read

jobs:
  coverage:
    name: Report test coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        run: uv sync --locked --dev --all-extras

      # The sidecar tests skip without it, and under CI a skip fails the run
      # (tests/ci_skips.py). Same setup as quality.yml.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: ts/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml

      - name: Install the Flint sidecar
        run: pnpm --dir ts install --frozen-lockfile

      - name: Run tests with coverage
        run: uv run pytest --cov=src/s_layer_flint_charts --cov-report=xml --cov-report=term

      - name: Post coverage comment
        uses: MishaKav/pytest-coverage-comment@v1.13.1
        with:
          pytest-coverage-path: coverage.xml
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache pruning
        if: always()
        run: uv cache prune --ci
