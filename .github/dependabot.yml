
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      python-uv:
        patterns:
          - "*"

  # flint-chart is pinned exactly in both directories (the Python sidecar reads its version
  # from src/s_layer_flint_charts/node/package.json); the flint group bumps both in one PR.
  - package-ecosystem: "npm"
    directories:
      - "/ts"
      - "/src/s_layer_flint_charts/node"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      flint:
        patterns:
          - "flint-chart"
      npm:
        patterns:
          - "*"
