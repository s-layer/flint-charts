[project]
name = "s-layer-flint-charts"
version = "0.2.0"
description = "Semantic-layer-aware Flint charts for agents: types, grain guard and show_chart tool"
readme = "README.md"
authors = [
    { name = "Anentropic", email = "ego@anentropic.com" }
]
requires-python = ">=3.11"
dependencies = [
    "orjson>=3.10",
    "pyarrow>=18",
    "s-layer-semantic-formats>=0.2.0,<0.3",
    "semolina>=0.9.1",
]

[project.optional-dependencies]
server = [
    "backports-zstd>=1.0 ; python_full_version < '3.14'",
    "starlette>=0.40",
]
validate = [
    "mcp>=2.0",
]
pydantic-ai = [
    "pydantic-ai-slim>=2.0",
]

[build-system]
requires = ["uv_build>=0.9.18,<1.0.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.38.0",
    "httpx>=0.28",
    "hypothesis>=6.100",
    "ipython>=9.10.0",
    "pdbpp>=0.12.0.post1",
    "pyarrow-stubs>=20.0.0.20260625",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.1",
]
docs = [
    "sphinx>=8.0.0",
    "shibuya",
    "sphinx-design>=0.6.0",
    "sphinx-autoapi>=3.0.0",
    "sphinx-autobuild>=2024.0.0",
    "myst-parser>=4.0.0",
]

[tool.pyright]
# The minimum supported version, not the dev version: an explicit pythonVersion
# overrides the running interpreter, so setting it to the dev version lets newer
# stdlib and typing APIs type-check clean on *every* CI leg -- including the
# minimum-version leg whose job is to catch them -- and fail at runtime instead.
# Kept in step with requires-python and ruff's target-version below.
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src", "tests"]
reportPrivateUsage = false

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TCH", "D"]
ignore = [
    "D1",    # don't require docstrings everywhere
    "D202",  # allow blank line after docstring (common in tests)
    "D203",  # conflicts with D211 (no blank line before class docstring)
    "D212",  # conflicts with D213 (multiline summary on second line)
    "D401",  # imperative mood is awkward for dunder methods
    "D413",  # blank line after last section not required
]

[tool.pytest.ini_options]
addopts = "-v"
